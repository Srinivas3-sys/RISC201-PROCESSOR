<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <rect x="10" y="10" width="860" height="220" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Top: Cache Bitfield Decomposition -->
  <text x="30" y="34" font-size="12" font-weight="bold" fill="#0f172a">A. 32-Bit Physical Address -> 32 KB 8-Way Cache Decomposition (64-Byte Line)</text>

  <g transform="translate(30, 44)">
    <rect x="0" y="0" width="520" height="38" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="260" y="18" font-size="10.5" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Tag Field: 20 bits [31:12]</text>
    <text x="260" y="31" font-size="8.5" fill="#64748b" text-anchor="middle">Compared against 8 ways in selected set</text>

    <rect x="528" y="0" width="156" height="38" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
    <text x="606" y="18" font-size="10.5" font-weight="bold" fill="#15803d" text-anchor="middle">Index: 6 bits [11:6]</text>
    <text x="606" y="31" font-size="8.5" fill="#64748b" text-anchor="middle">64 Sets</text>

    <rect x="692" y="0" width="128" height="38" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/>
    <text x="756" y="18" font-size="10.5" font-weight="bold" fill="#c2410c" text-anchor="middle">Offset: 6 bits [5:0]</text>
    <text x="756" y="31" font-size="8.5" fill="#64748b" text-anchor="middle">64 B line</text>
  </g>

  <!-- Bottom: 48-Bit Virtual Address 4-Level Radix Split -->
  <text x="30" y="120" font-size="12" font-weight="bold" fill="#0f172a">B. 48-Bit Virtual Address -> 4-Level Hierarchical Radix Tree (PML4 -> PDPT -> PD -> PT)</text>

  <g transform="translate(30, 130)">
    <rect x="0" y="0" width="158" height="42" rx="4" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.2"/>
    <text x="79" y="18" font-size="10" font-weight="bold" fill="#6d28d9" text-anchor="middle">PML4: 9b [47:39]</text>
    <text x="79" y="33" font-size="8" fill="#64748b" text-anchor="middle">512 Entries (CR3 base)</text>

    <rect x="164" y="0" width="158" height="42" rx="4" fill="#faf5ff" stroke="#a855f7" stroke-width="1.2"/>
    <text x="243" y="18" font-size="10" font-weight="bold" fill="#7e22ce" text-anchor="middle">PDPT: 9b [38:30]</text>
    <text x="243" y="33" font-size="8" fill="#64748b" text-anchor="middle">512 Entries (1 GB/entry)</text>

    <rect x="328" y="0" width="158" height="42" rx="4" fill="#fdf4ff" stroke="#d946ef" stroke-width="1.2"/>
    <text x="407" y="18" font-size="10" font-weight="bold" fill="#a21caf" text-anchor="middle">PD: 9b [29:21]</text>
    <text x="407" y="33" font-size="8" fill="#64748b" text-anchor="middle">512 Entries (2 MB/entry)</text>

    <rect x="492" y="0" width="158" height="42" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="571" y="18" font-size="10" font-weight="bold" fill="#1d4ed8" text-anchor="middle">PT: 9b [20:12]</text>
    <text x="571" y="33" font-size="8" fill="#64748b" text-anchor="middle">512 PTEs (4 KB page)</text>

    <rect x="656" y="0" width="164" height="42" rx="4" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/>
    <text x="738" y="18" font-size="10" font-weight="bold" fill="#c2410c" text-anchor="middle">Offset: 12b [11:0]</text>
    <text x="738" y="33" font-size="8" fill="#64748b" text-anchor="middle">4096-Byte Page Offset</text>
  </g>

  <text x="30" y="202" font-size="9" fill="#64748b">Direct bit extraction: Offset bits = log2(PageSize), Each Table Level = 9 bits (512 8-byte PTEs fill exactly one 4 KB physical page frame).</text>
</svg>
