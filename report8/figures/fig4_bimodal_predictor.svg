<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="transArr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="10" y="10" width="860" height="180" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="30" y="34" font-size="13" font-weight="bold" fill="#0f172a">2-Bit Bimodal Saturating Counter State Machine (Sarangi Ch. 8, Section 8.4)</text>

  <!-- States Group -->
  <g transform="translate(40, 50)">
    <!-- State 00: Strongly Not Taken -->
    <rect x="0" y="15" width="160" height="65" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="80" y="40" font-size="12" font-weight="bold" fill="#991b1b" text-anchor="middle">00: Strongly NT</text>
    <text x="80" y="58" font-size="10" fill="#dc2626" text-anchor="middle">Predict NOT-TAKEN</text>

    <!-- State 01: Weakly Not Taken -->
    <rect x="220" y="15" width="160" height="65" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="300" y="40" font-size="12" font-weight="bold" fill="#9a3412" text-anchor="middle">01: Weakly NT</text>
    <text x="300" y="58" font-size="10" fill="#ea580c" text-anchor="middle">Predict NOT-TAKEN</text>

    <!-- State 10: Weakly Taken -->
    <rect x="440" y="15" width="160" height="65" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
    <text x="520" y="40" font-size="12" font-weight="bold" fill="#115e59" text-anchor="middle">10: Weakly Taken</text>
    <text x="520" y="58" font-size="10" fill="#0d9488" text-anchor="middle">Predict TAKEN</text>

    <!-- State 11: Strongly Taken -->
    <rect x="660" y="15" width="160" height="65" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="740" y="40" font-size="12" font-weight="bold" fill="#166534" text-anchor="middle">11: Strongly Taken</text>
    <text x="740" y="58" font-size="10" fill="#16a34a" text-anchor="middle">Predict TAKEN</text>

    <!-- Forward Arrows (Taken -> Increment) -->
    <!-- 00 -> 01 -->
    <path d="M 160 35 L 220 35" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#transArr)"/>
    <text x="190" y="27" font-size="9" font-weight="bold" fill="#16a34a" text-anchor="middle">Taken</text>

    <!-- 01 -> 10 -->
    <path d="M 380 35 L 440 35" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#transArr)"/>
    <text x="410" y="27" font-size="9" font-weight="bold" fill="#16a34a" text-anchor="middle">Taken</text>

    <!-- 10 -> 11 -->
    <path d="M 600 35 L 660 35" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#transArr)"/>
    <text x="630" y="27" font-size="9" font-weight="bold" fill="#16a34a" text-anchor="middle">Taken</text>

    <!-- Backward Arrows (Not-Taken -> Decrement) -->
    <!-- 11 -> 10 -->
    <path d="M 660 60 L 600 60" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#transArr)"/>
    <text x="630" y="74" font-size="9" font-weight="bold" fill="#dc2626" text-anchor="middle">Not-Taken</text>

    <!-- 10 -> 01 -->
    <path d="M 440 60 L 380 60" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#transArr)"/>
    <text x="410" y="74" font-size="9" font-weight="bold" fill="#dc2626" text-anchor="middle">Not-Taken</text>

    <!-- 01 -> 00 -->
    <path d="M 220 60 L 160 60" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#transArr)"/>
    <text x="190" y="74" font-size="9" font-weight="bold" fill="#dc2626" text-anchor="middle">Not-Taken</text>

    <!-- Self-Loops (Saturation) -->
    <!-- SNT Not-Taken loop -->
    <path d="M 20 15 C 20 -10, 60 -10, 60 15" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#transArr)"/>
    <text x="40" y="-2" font-size="8.5" fill="#dc2626" text-anchor="middle">Not-Taken</text>

    <!-- ST Taken loop -->
    <path d="M 720 15 C 720 -10, 760 -10, 760 15" fill="none" stroke="#16a34a" stroke-width="1.5" marker-end="url(#transArr)"/>
    <text x="740" y="-2" font-size="8.5" fill="#16a34a" text-anchor="middle">Taken</text>

    <!-- Hysteresis Note -->
    <text x="410" y="105" font-size="9.5" fill="#64748b" text-anchor="middle">Hysteresis Property: A single anomaly (e.g. one-off loop exit) changes WT -> ST or ST -> WT without inverting prediction direction.</text>
  </g>
</svg>

