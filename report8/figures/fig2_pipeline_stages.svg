<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="10" y="10" width="860" height="220" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- 4-Stage Pipeline Section -->
  <text x="30" y="38" font-size="13" font-weight="bold" fill="#1e293b">4-Stage Pipeline (500 MHz, t_clk = 2.00 ns, Fill Latency = 3 cyc, Branch Penalty = 1 cyc)</text>
  
  <g transform="translate(30, 48)">
    <!-- Stage IF -->
    <rect x="0" y="0" width="170" height="48" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="85" y="22" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Stage 1: IF</text>
    <text x="85" y="38" font-size="9" fill="#475569" text-anchor="middle">Fetch PC &amp; L1 I-Cache</text>

    <!-- Reg IF/OF -->
    <rect x="178" y="4" width="12" height="40" rx="2" fill="#cbd5e1"/>

    <!-- Stage OF -->
    <rect x="198" y="0" width="170" height="48" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="283" y="22" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Stage 2: OF</text>
    <text x="283" y="38" font-size="9" fill="#475569" text-anchor="middle">Decode + Reg Read (rs1, rs2)</text>

    <!-- Reg OF/EX -->
    <rect x="376" y="4" width="12" height="40" rx="2" fill="#cbd5e1"/>

    <!-- Stage EX -->
    <rect x="396" y="0" width="170" height="48" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="481" y="22" font-size="12" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Stage 3: EX</text>
    <text x="481" y="38" font-size="9" fill="#475569" text-anchor="middle">ALU Calc &amp; Branch Resolution</text>

    <!-- Reg EX/MARW -->
    <rect x="574" y="4" width="12" height="40" rx="2" fill="#cbd5e1"/>

    <!-- Stage MA_RW -->
    <rect x="594" y="0" width="220" height="48" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="704" y="22" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">Stage 4: MA_RW (Merged)</text>
    <text x="704" y="38" font-size="9" fill="#475569" text-anchor="middle">L1 D-Cache Access &amp; RegFile Writeback</text>
  </g>

  <!-- 6-Stage Pipeline Section -->
  <text x="30" y="132" font-size="13" font-weight="bold" fill="#1e293b">6-Stage Pipeline (800 MHz, t_clk = 1.25 ns, Fill Latency = 5 cyc, Branch Penalty = 2 cyc)</text>
  
  <g transform="translate(30, 142)">
    <!-- Stage IF -->
    <rect x="0" y="0" width="120" height="48" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <text x="60" y="22" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">Stage 1: IF</text>
    <text x="60" y="38" font-size="8.5" fill="#475569" text-anchor="middle">PC Fetch &amp; I-Cache</text>

    <rect x="125" y="6" width="9" height="36" rx="2" fill="#cbd5e1"/>

    <!-- Stage ID -->
    <rect x="139" y="0" width="120" height="48" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <text x="199" y="22" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">Stage 2: ID</text>
    <text x="199" y="38" font-size="8.5" fill="#475569" text-anchor="middle">Opcode &amp; Field Decode</text>

    <rect x="264" y="6" width="9" height="36" rx="2" fill="#cbd5e1"/>

    <!-- Stage RF -->
    <rect x="278" y="0" width="120" height="48" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <text x="338" y="22" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">Stage 3: RF</text>
    <text x="338" y="38" font-size="8.5" fill="#475569" text-anchor="middle">Register File Read</text>

    <rect x="403" y="6" width="9" height="36" rx="2" fill="#cbd5e1"/>

    <!-- Stage EX -->
    <rect x="417" y="0" width="120" height="48" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="477" y="22" font-size="11" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Stage 4: EX</text>
    <text x="477" y="38" font-size="8.5" fill="#475569" text-anchor="middle">ALU &amp; Branch Eval</text>

    <rect x="542" y="6" width="9" height="36" rx="2" fill="#cbd5e1"/>

    <!-- Stage MA -->
    <rect x="556" y="0" width="120" height="48" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="616" y="22" font-size="11" font-weight="bold" fill="#1d4ed8" text-anchor="middle">Stage 5: MA</text>
    <text x="616" y="38" font-size="8.5" fill="#475569" text-anchor="middle">Data Cache Access</text>

    <rect x="681" y="6" width="9" height="36" rx="2" fill="#cbd5e1"/>

    <!-- Stage WB -->
    <rect x="695" y="0" width="120" height="48" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="755" y="22" font-size="11" font-weight="bold" fill="#15803d" text-anchor="middle">Stage 6: WB</text>
    <text x="755" y="38" font-size="8.5" fill="#475569" text-anchor="middle">Register Writeback</text>
  </g>

  <!-- Flush Penalty Note -->
  <text x="30" y="215" font-size="10" font-style="italic" fill="#64748b">* Branch resolution in EX stage squashes younger instructions: 4-stage core flushes IF_OF (1 bubble); 6-stage core flushes IF_ID and ID_RF (2 bubbles).</text>
</svg>

