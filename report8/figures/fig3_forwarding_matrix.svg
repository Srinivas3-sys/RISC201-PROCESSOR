<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="fwdArr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="stallArr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="10" y="10" width="860" height="240" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="30" y="36" font-size="13" font-weight="bold" fill="#0f172a">Data Forwarding Bypass Network &amp; Priority Resolution Logic</text>

  <!-- Left: Schematic Bypass Flow -->
  <g transform="translate(30, 50)">
    <!-- Pipeline Registers -->
    <rect x="0" y="0" width="85" height="40" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="42" y="24" font-size="11" font-weight="bold" fill="#1d4ed8" text-anchor="middle">RF / EX</text>

    <rect x="120" y="0" width="85" height="40" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="162" y="24" font-size="11" font-weight="bold" fill="#1d4ed8" text-anchor="middle">EX / MA</text>

    <rect x="240" y="0" width="85" height="40" rx="4" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="282" y="24" font-size="11" font-weight="bold" fill="#1d4ed8" text-anchor="middle">MA / RW</text>

    <rect x="360" y="0" width="85" height="40" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
    <text x="402" y="24" font-size="11" font-weight="bold" fill="#15803d" text-anchor="middle">RW / Reg</text>

    <!-- Forwarding Multiplexer in front of EX -->
    <polygon points="65,90 95,90 85,135 75,135" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="80" y="116" font-size="10" font-weight="bold" fill="#b45309" text-anchor="middle">MUX</text>

    <!-- Bypass Lines -->
    <!-- Path 1: EX_MA -> EX (Priority 1) -->
    <path d="M 162 40 L 162 100 L 95 100" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#fwdArr)"/>
    <text x="166" y="85" font-size="9" font-weight="bold" fill="#059669">P1: EX->EX (Dist 1)</text>

    <!-- Path 2: MA_RW -> EX (Priority 2) -->
    <path d="M 282 40 L 282 118 L 95 118" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#fwdArr)"/>
    <text x="286" y="85" font-size="9" font-weight="bold" fill="#0284c7">P2: MEM->EX (Dist 2)</text>

    <!-- Path 3: RW -> EX (Priority 3) -->
    <path d="M 402 40 L 402 135 L 95 135" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#fwdArr)"/>
    <text x="350" y="152" font-size="8.5" fill="#64748b">P3: WB->EX (Dist 3)</text>
  </g>

  <!-- Right: Producer-Consumer Matrix Table -->
  <g transform="translate(485, 45)">
    <rect x="0" y="0" width="370" height="185" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    
    <!-- Table Header -->
    <rect x="0" y="0" width="370" height="28" rx="6" fill="#f1f5f9"/>
    <text x="10" y="18" font-size="10" font-weight="bold" fill="#334155">Producer Inst</text>
    <text x="110" y="18" font-size="10" font-weight="bold" fill="#334155">Consumer Inst</text>
    <text x="210" y="18" font-size="10" font-weight="bold" fill="#334155">Fwd Path</text>
    <text x="295" y="18" font-size="10" font-weight="bold" fill="#334155">Stall Cycles</text>

    <!-- Row 1 -->
    <line x1="0" y1="28" x2="370" y2="28" stroke="#e2e8f0"/>
    <text x="10" y="46" font-size="9.5" fill="#0f172a">ALU (add, sub)</text>
    <text x="110" y="46" font-size="9.5" fill="#0f172a">ALU (op1 / op2)</text>
    <text x="210" y="46" font-size="9.5" fill="#059669">EX -> EX</text>
    <text x="310" y="46" font-size="9.5" font-weight="bold" fill="#059669">0 cyc</text>

    <!-- Row 2 -->
    <line x1="0" y1="58" x2="370" y2="58" stroke="#e2e8f0"/>
    <text x="10" y="76" font-size="9.5" fill="#0f172a">ALU (i-2)</text>
    <text x="110" y="76" font-size="9.5" fill="#0f172a">ALU (op1 / op2)</text>
    <text x="210" y="76" font-size="9.5" fill="#0284c7">MEM -> EX</text>
    <text x="310" y="76" font-size="9.5" font-weight="bold" fill="#059669">0 cyc</text>

    <!-- Row 3 (Load-Use) -->
    <line x1="0" y1="88" x2="370" y2="88" stroke="#e2e8f0"/>
    <rect x="1" y="89" width="368" height="29" fill="#fef2f2"/>
    <text x="10" y="106" font-size="9.5" font-weight="bold" fill="#b91c1c">Load (ld rd, mem)</text>
    <text x="110" y="106" font-size="9.5" font-weight="bold" fill="#b91c1c">ALU (uses rd)</text>
    <text x="210" y="106" font-size="9.5" fill="#b91c1c">MEM -> EX (delayed)</text>
    <text x="310" y="106" font-size="9.5" font-weight="bold" fill="#b91c1c">1 bubble</text>

    <!-- Row 4 -->
    <line x1="0" y1="118" x2="370" y2="118" stroke="#e2e8f0"/>
    <text x="10" y="136" font-size="9.5" fill="#0f172a">Load (ld rd, mem)</text>
    <text x="110" y="136" font-size="9.5" fill="#0f172a">Store (st data)</text>
    <text x="210" y="136" font-size="9.5" fill="#059669">MEM -> MEM</text>
    <text x="310" y="136" font-size="9.5" font-weight="bold" fill="#059669">0 cyc</text>

    <!-- Row 5 -->
    <line x1="0" y1="148" x2="370" y2="148" stroke="#e2e8f0"/>
    <text x="10" y="166" font-size="9.5" fill="#0f172a">Load (separated)</text>
    <text x="110" y="166" font-size="9.5" fill="#0f172a">ALU (gap >= 1)</text>
    <text x="210" y="166" font-size="9.5" fill="#059669">MEM -> EX</text>
    <text x="310" y="166" font-size="9.5" font-weight="bold" fill="#059669">0 cyc</text>
  </g>
</svg>

